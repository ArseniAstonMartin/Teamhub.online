# =============================================================================
# Backend CI — Teamhub.online
# =============================================================================
#
# Required status check:
#   After merging this file, go to GitHub repo →  Settings → Branches →
#   Add branch protection rule for `main`.  Under "Require status checks to
#   pass before merging", search for and add the job named  `backend-ci`.
#   This ensures no PR can land on main without passing all steps below.
#
# Test tiers:
#   - pull_request: unit tests only (@Tag("unit")) — fast feedback
#   - push to main: full suite incl. @Tag("integration") — uses GHA service
#     containers (Postgres/PostGIS, Redis, MinIO), not Testcontainers
#
# Coverage:
#   - jacocoTestReport runs in CI (feeds SonarCloud new-code gate)
#   - jacocoTestCoverageVerification is NOT run in CI; run locally via
#     `./gradlew jacocoTestCoverageVerification` when you need a full report
#
# =============================================================================

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: teamhub_test
          POSTGRES_USER: teamhub
          POSTGRES_PASSWORD: teamhub_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamhub -d teamhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history is needed by gitleaks for commit-range scanning
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/build.gradle.kts', 'backend/settings.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Spotless, Checkstyle, tests, JaCoCo report, SonarCloud
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/teamhub_test
          SPRING_DATASOURCE_USERNAME: teamhub
          SPRING_DATASOURCE_PASSWORD: teamhub_secret
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: teamhub
          TESTCONTAINERS_CHECKS_DISABLE: "true"
          SONAR_TOKEN: ${{ secrets.TEAMHUB_SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRADLE_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GRADLE_ARGS="-PexcludeIntegration=true"
          fi
          ./gradlew spotlessCheck checkstyleMain test jacocoTestReport sonar --no-daemon $GRADLE_ARGS

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/
          retention-days: 14

      # TO-DO: Disable SonarCloud Automatic Analysis for this project to avoid
      # double scans (this CI scanner + the automatic analysis triggered by
      # GitHub events). Go to:
      #   https://sonarcloud.io/project/administration?id=ArseniAstonMartin_Teamhub.online
      #   Administration → Analysis Method → turn off "Automatic Analysis".

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
