# =============================================================================
# Mobile CI — Teamhub.online
# =============================================================================
#
# Required status check:
#   After merging this file, go to GitHub repo → Settings → Branches →
#   Add branch protection rule for `main`. Under "Require status checks to
#   pass before merging", search for and add the job named
#   `Lint · Typecheck · Unit Tests`.
#
# EAS dry-run is gated behind the `[mobile-build]` PR label OR the weekly
# Sunday cron to avoid consuming EAS Build quota on every push.
#
# =============================================================================

name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  schedule:
    # Weekly EAS dry-run on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage

  eas-dry-run:
    name: EAS Build dry-run (development)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Run on weekly schedule OR when PR has [mobile-build] label
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'mobile-build'))
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for EXPO_TOKEN secret
        id: check-token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is not set — skipping EAS dry-run"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install EAS CLI
        if: steps.check-token.outputs.skip == 'false'
        run: npm install -g eas-cli

      - name: EAS Build dry-run (development, iOS simulator)
        if: steps.check-token.outputs.skip == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile development --non-interactive --no-wait --dry-run
