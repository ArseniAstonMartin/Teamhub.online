# Required status check: Add 'web-ci' to branch protection rules for `main`
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  # Nightly run at 02:00 UTC — catches regressions not triggered by code changes
  schedule:
    - cron: '0 2 * * *'

jobs:
  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        # Serve the production build on the same port that playwright.config.ts expects (5173)
        # so that reuseExistingServer can pick it up in the next step.
        run: npm run preview -- --port 5173 &

      - name: Wait for preview server to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done'

      - name: Run e2e tests against preview
        # Setting CI='' makes reuseExistingServer evaluate to true (!'' === true in JS),
        # so Playwright reuses the running preview server instead of starting a dev server.
        run: npm run test:e2e
        env:
          CI: ''

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
