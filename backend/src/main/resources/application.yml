spring:
  application:
    name: teamhub-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # Development default points to MailHog (infra/docker-compose.dev.yml).
    # Override with real SMTP credentials via env vars in staging/production.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    redis:
      enabled: false
    mail:
      enabled: false

# TO-DO: human must provision Sentry projects per PRD §26.2 before enabling in production.
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2
  environment: ${SPRING_PROFILES_ACTIVE:local}
  release: teamhub-backend@${APP_VERSION:0.0.1}+${GIT_SHA:local}
  send-default-pii: false

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: true
  swagger-ui:
    enabled: false

teamhub:
  cors:
    # In production override with https://app.teamhub.online; dev default is the Vite dev server.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    # RS256 keypair PEM paths. When blank, an ephemeral keypair is generated at startup
    # (development/test only — configure persistent keys in production, PRD §24.4).
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    kid: ${JWT_KID:}
    issuer: ${JWT_ISSUER:https://app.teamhub.online}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  # Base URL of the SPA — used to construct the password-reset link sent by email (PRD §6.3).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
