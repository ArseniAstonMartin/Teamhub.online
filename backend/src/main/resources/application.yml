spring:
  application:
    name: teamhub-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

teamhub:
  jwt:
    # RS256 keypair PEM paths. When blank, an ephemeral keypair is generated at startup
    # (development/test only — configure persistent keys in production, PRD §24.4).
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    kid: ${JWT_KID:}
    issuer: ${JWT_ISSUER:https://app.teamhub.online}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
