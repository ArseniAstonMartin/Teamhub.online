spring:
  application:
    name: teamhub-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            # TO-DO: human must provision Google OAuth2 credentials per PRD §26.2 before enabling in production.
            client-id: 1058097714649-1thaja2pa2j8q7ipkjgkefnre2oi6dii.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com

  mail:
    # Development default points to MailHog (infra/docker-compose.dev.yml).
    # Override with real SMTP credentials via env vars in staging/production.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    redis:
      enabled: false
    mail:
      enabled: false

# TO-DO: human must provision Sentry projects per PRD §26.2 before enabling in production.
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2
  environment: ${SPRING_PROFILES_ACTIVE:local}
  release: teamhub-backend@${APP_VERSION:0.0.1}+${GIT_SHA:local}
  send-default-pii: false

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: strict

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: true
  swagger-ui:
    enabled: false
  paths-to-exclude: /api/v1/internal/**

teamhub:
  internal:
    # Comma-separated IPs allowed to reach /api/v1/internal/** (TASK-131).
    allowed-ips: ${INTERNAL_ALLOWED_IPS:127.0.0.1,::1}
  cors:
    # In production override with https://app.teamhub.online; dev default is the Vite dev server.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    # RS256 keypair PEM paths. When blank, an ephemeral keypair is generated at startup
    # (development/test only — configure persistent keys in production, PRD §24.4).
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    kid: ${JWT_KID:}
    issuer: ${JWT_ISSUER:https://app.teamhub.online}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  # Base URL of the SPA — used to construct the password-reset link sent by email (PRD §6.3).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    success-redirect-url: ${FRONTEND_URL:http://localhost:5173}/auth/callback
    failure-redirect-url: ${FRONTEND_URL:http://localhost:5173}/auth/error
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:teamhub}
    region: ${MINIO_REGION:us-east-1}
    presigned-url-ttl-minutes: 5
  google:
    # TO-DO: restrict API key in Google Cloud Console — HTTP referrer for web, IP allowlist for server (PRD §8.1)
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  rate-limit:
    routes:
      auth-ip:
        limit: 5
        window-seconds: 60
      job-claim-user:
        limit: 10
        window-seconds: 60
  # TO-DO: Provision Stripe secrets per PRD §26.2:
  #   STRIPE_SECRET_KEY      — restricted API key (rk_test_... / rk_live_...)
  #   STRIPE_PRICE_FREE      — price_xxx from seed-products script
  #   STRIPE_PRICE_STARTER   — price_xxx from seed-products script
  #   STRIPE_PRICE_TEAM      — price_xxx from seed-products script
  #   STRIPE_PRICE_ENTERPRISE— price_xxx from seed-products script
  #   STRIPE_WEBHOOK_SECRET  — whsec_... from Stripe Dashboard webhook endpoint
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    price-free: ${STRIPE_PRICE_FREE:}
    price-starter: ${STRIPE_PRICE_STARTER:}
    price-team: ${STRIPE_PRICE_TEAM:}
    price-enterprise: ${STRIPE_PRICE_ENTERPRISE:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  push:
    expo-push-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    max-batch-size: 100
    retry-max-attempts: 3
    retry-backoff-ms: 1000
