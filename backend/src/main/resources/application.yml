spring:
  application:
    name: teamhub-backend
  # Data infrastructure is introduced by subsequent migration and local-stack tasks.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Redis is introduced with the local development stack in a subsequent task.
    redis:
      enabled: false
