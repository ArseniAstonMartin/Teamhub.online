spring:
  application:
    name: teamhub-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
