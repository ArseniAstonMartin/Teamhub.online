server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: teamhub-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: teamhub-backend
          service: teamhub-backend
          __path__: /var/log/teamhub/backend/*.log
