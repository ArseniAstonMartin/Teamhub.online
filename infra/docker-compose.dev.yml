name: teamhub-dev

services:
  postgres:
    # Upstream PostGIS tags do not currently publish linux/arm64 manifests.
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: teamhub
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  mailhog:
    # MailHog's stable image is published for linux/amd64.
    platform: linux/amd64
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8025/"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
