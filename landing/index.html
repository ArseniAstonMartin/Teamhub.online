<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamhub — Field Service Management</title>
  <meta name="description" content="Simple, powerful field service management for US service businesses. Dispatching, scheduling, and team coordination — all in one place." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #1e40af;
      letter-spacing: -0.3px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .hero {
      text-align: center;
      max-width: 560px;
    }

    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      color: #0f172a;
      margin-bottom: 20px;
    }

    h1 span { color: #1d4ed8; }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 40px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1d4ed8;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .cta:hover { background: #1e40af; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">Teamhub</span>
  </header>

  <main>
    <div class="hero">
      <span class="badge">Coming soon</span>
      <h1>Field service management<br /><span>built for the field</span></h1>
      <p>Dispatching, scheduling, and team coordination for US service businesses — plumbers, electricians, HVAC, locksmiths, and more.</p>
      <a href="mailto:hello@teamhub.online" class="cta">Get early access →</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Teamhub. All rights reserved.
  </footer>
</body>
</html>
